<head>

  <title>设置 · 庖丁</title>
  <style>
    :root{color-scheme:light;--ink:#24382d;--muted:#5f7063;--paper:#f5f4ed;--line:#d9ded4;--accent:#285b3e;--warm:#e9e8de}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}
    header{background:#243d2e;color:#f6f6ee;padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{font-family:"Songti SC",serif;font-size:25px;letter-spacing:.18em;font-weight:700}.brand small{font-family:sans-serif;font-size:10px;letter-spacing:.18em;font-weight:400;margin-left:12px;color:#b7c7b8}header a{color:#d7e3d7;text-decoration:none;font-size:13px}
    main{max-width:1120px;margin:auto;padding:62px 24px 110px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#758779;font-weight:700}.intro{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:end;margin:8px 0 46px}
    h1{font-family:"Songti SC",serif;font-size:clamp(36px,5vw,56px);line-height:1.18;letter-spacing:.03em;margin:0;font-weight:700}.intro p{margin:0;color:var(--muted);max-width:440px} .note{border-top:1px solid var(--line);padding-top:18px}
    .layout{display:grid;grid-template-columns:220px 1fr;gap:54px}.sidebar{position:sticky;top:30px;align-self:start}.sidebar p{font-size:12px;color:var(--muted)}.sidebar a{display:block;padding:9px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
    details{border-top:1px solid #bfcabf;padding:0}details:last-of-type{border-bottom:1px solid #bfcabf}summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:23px 0;font-size:20px;font-family:"Songti SC",serif;font-weight:700}summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-family:sans-serif;font-size:19px;color:var(--muted);font-weight:400}details[open] summary:after{content:"－"}
    .group-help{color:var(--muted);margin:0 0 20px;font-size:13px}.row{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:18px;padding:14px 0;align-items:start}.row label{font-weight:600;padding-top:10px}.row small{display:block;color:var(--muted);font-weight:400;font-size:12px}.inputwrap{display:flex;gap:8px;align-items:center}input{width:100%;border:1px solid #c9d1c6;background:#fffefa;border-radius:3px;padding:11px 12px;color:var(--ink);font:inherit;min-width:0}input:focus{outline:2px solid #8eb397;outline-offset:2px}.state{font-size:12px;white-space:nowrap;color:var(--muted);min-width:56px}.state.yes{color:#286943}.help{display:block;color:#718174;font-size:12px;margin-top:5px}.actions{display:flex;gap:16px;align-items:center;position:sticky;bottom:0;background:var(--paper);padding:20px 0;border-top:1px solid var(--line);margin-top:28px}button{border:0;border-radius:3px;padding:12px 24px;background:var(--accent);color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{font-size:13px;color:var(--accent)}#error{color:#a13225;font-size:13px;min-height:1.6em}.provider{padding:20px 0 26px;border-bottom:1px solid var(--line)}.provider h3{font-size:18px;margin:0 0 4px}.provider-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0 0 218px}.secondary{padding:8px 12px;border:1px solid #9eb1a2;background:transparent;color:var(--accent);font-weight:500;font-size:13px}.result{font-size:13px;color:var(--muted);margin:12px 0 0 218px;white-space:pre-line}.result select{display:block;max-width:100%;margin:8px 0;padding:8px;border:1px solid #bfcabf;background:#fffefa;color:var(--ink)}.model-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}.model-name{flex:1 1 220px;overflow-wrap:anywhere}.model-status{flex-basis:100%;color:var(--muted);font-size:12px}.model-add{display:flex;gap:8px;margin-top:14px}.custom-form{background:#eeefe7;padding:18px;margin:20px 0}.custom-form label{display:block;margin-top:12px;font-weight:600}.custom-form input{margin-top:4px}.token{border:1px solid var(--line);padding:16px;margin-bottom:24px}.token label{display:block;font-weight:600;margin-bottom:8px}.token button{margin-top:10px}
    @media(max-width:720px){.provider-actions,.result{margin-left:0}main{padding-top:42px}.intro{grid-template-columns:1fr;gap:20px;margin-bottom:32px}.layout{grid-template-columns:1fr;gap:10px}.sidebar{display:none}.row{grid-template-columns:1fr;gap:5px;padding:13px 0}.row label{padding:0}.actions{bottom:0}}
  </style>
</head>
<body>
<header><div class="brand">庖丁 <small>PAODING ENGINE</small></div><a href="/docs">接口文档 ↗</a></header>
<main>
  <div class="eyebrow">CONTROL ROOM / 01</div>
  <div class="intro"><h1>把工具<br>接入庖丁。</h1><p class="note">从一个模型开始即可。需要更多平台时，再展开对应设置。已保存的密钥不会显示；留空会保留原值。</p></div>
  <div id="auth" class="token" hidden><label for="token">本机 API 访问令牌</label><input id="token" type="password" autocomplete="off"><button type="button" id="connect">连接</button></div>
  <div class="layout"><aside class="sidebar"><strong>连接与服务</strong><p>按需设置，不必一次填完。</p><nav id="nav"></nav></aside>
  <form id="form"><div id="error" role="alert"></div><div id="groups"></div><div class="actions"><button id="save" type="submit">保存设置</button><span id="status" role="status" aria-live="polite"></span></div><p class="help">单个模型测试会发送简短文字请求，可能产生费用；测试前请确认服务地址可信。列表同步不自动切换当前模型。</p></form></div>
</main>
<script>
const $=id=>document.getElementById(id), groupNames=['模型','Google 授权','模型路由','采集','文档','Telegram','飞书','企业微信','高级'];
const builtin=[['deepseek','DeepSeek','DEEPSEEK_API_KEY'],['qwen','通义千问','QWEN_API_KEY'],['gemini','Gemini','GEMINI_API_KEY'],['doubao','豆包','DOUBAO_API_KEY'],['anthropic','Claude','ANTHROPIC_API_KEY'],['openai','OpenAI','OPENAI_API_KEY']];
const hints={'模型':'服务商连接测试检查模型列表接口；单模型测试会单独发送一次真实文字请求，可能产生费用。网页授权与各厂商原生账号订阅的权限、计费可能不同。','Google 授权':'Google Cloud 授权需先启用 Generative Language API，并配置 OAuth 桌面客户端。授权会请求 Google Cloud 权限，调用使用所填项目的配额及计费，与 Gemini 网页订阅分开。','模型路由':'格式：服务商:模型ID；多个备选用英文逗号隔开。留空使用默认路由。','采集':'抖音和小红书可使用 TikHub；RSS 地址用于账号追踪。','文档':'按需接入文档或网页解析服务。','高级':'填写服务商名称和模型 ID，例如 openai 与 whisper-1。'};
let fields=[],customs=[],catalog=[],routes={},chatgptConnected=false,googleConnected=false,auth=localStorage.getItem('paoding-token')||'';
function headers(){return auth?{'Authorization':'Bearer '+auth}:{}}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})},cache:'no-store'});if(response.status===401){$('auth').hidden=false;throw Error('请填写本机 API 访问令牌。')}const data=await response.json();if(!response.ok)throw Error(data.error?.message||data.detail||'请求失败');return data}
async function load(){try{const [settings,providerData,models]=await Promise.all([api('/api/v1/settings'),api('/api/v1/models/providers'),api('/api/v1/models')]);fields=settings.fields;customs=providerData.providers;routes=providerData.routes;chatgptConnected=providerData.chatgpt_connected;googleConnected=providerData.gemini_google_connected;catalog=models;render();$('error').textContent='';$('auth').hidden=true;const oauth=new URL(location.href).searchParams.get('oauth');if(oauth){$('status').textContent=oauth==='failed'?'授权未完成，请重试。':'授权成功，可以同步或添加模型。';history.replaceState(null,'',location.pathname)}}catch(error){$('error').textContent=error.message}}
function fieldRow(f){const row=document.createElement('div');row.className='row';const label=document.createElement('label');label.htmlFor=f.key;label.textContent=f.label;const small=document.createElement('small');small.textContent=f.key;label.append(small);const column=document.createElement('div'),wrap=document.createElement('div'),input=document.createElement('input'),state=document.createElement('span');wrap.className='inputwrap';input.id=f.key;input.name=f.key;input.type=f.secret?'password':'text';input.autocomplete='off';input.value=f.secret?'':f.value;input.dataset.initial=input.value;input.placeholder=f.secret?(f.configured?'已配置，留空保持不变':'填写后保存'):'选填';state.className='state'+(f.configured?' yes':'');state.id='state-'+f.key;state.textContent=f.configured?'已配置':'未配置';wrap.append(input,state);column.append(wrap);if(f.environment_override){const tip=document.createElement('span');tip.className='help';tip.textContent='此项由环境变量覆盖，请同时更新环境变量。';column.append(tip)}row.append(label,column);return row}
function action(label,fn){const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.onclick=fn;return b}
function node(tag,text,cls){const element=document.createElement(tag);if(text)element.textContent=text;if(cls)element.className=cls;return element}
function buildCustomForm(){const details=node('details',null,'custom-form'),summary=node('summary','添加自定义服务商');details.append(summary);const wrap=node('div');const preset=node('select');preset.id='preset';for(const [value,label] of [['custom','自定义 OpenAI 兼容服务'],['openrouter','OpenRouter'],['atlascloud','Atlas Cloud']]){const option=node('option',label);option.value=value;preset.append(option)}wrap.append(preset);for(const [id,label,type,placeholder] of [['new-id','服务商标识（英文小写、数字、下划线）','text','例如 my_gateway'],['new-name','显示名称','text','例如 我的中转站'],['new-url','Base URL','url','例如 https://example.com/v1'],['new-key','API Key（可选）','password','留空可稍后配置']]){const l=node('label',label),input=node('input');input.id=id;input.type=type;input.placeholder=placeholder;input.autocomplete='off';l.append(input);wrap.append(l)}const checklabel=node('label','支持 video_url 视频输入（仅确认接口支持时勾选）'),check=node('input');check.type='checkbox';check.id='new-video';check.style.width='auto';checklabel.prepend(check);wrap.append(checklabel);const out=node('div',null,'help');wrap.append(action('添加服务商',async()=>{try{const body={id:$('new-id').value.trim(),name:$('new-name').value.trim(),base_url:$('new-url').value.trim(),api_key:$('new-key').value,video_url_support:$('new-video').checked};const result=await api('/api/v1/models/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('new-key').value='';customs=customs.filter(x=>x.id!==result.id);customs.push(result);const old=$('provider-'+result.id);if(old)old.remove();$('custom-providers').append(providerPanel(result.id,result.name,null,result));details.open=false;out.textContent='';$('status').textContent='服务商已添加。';}catch(error){out.textContent=error.message}}),out);preset.onchange=()=>{if(preset.value==='openrouter'){$('new-id').value='openrouter';$('new-name').value='OpenRouter';$('new-url').value='https://openrouter.ai/api/v1';$('new-video').checked=true}else if(preset.value==='atlascloud'){$('new-id').value='atlascloud';$('new-name').value='Atlas Cloud';$('new-url').value='https://api.atlascloud.ai/v1';$('new-video').checked=false}else{$('new-id').value='';$('new-name').value='';$('new-url').value='';$('new-video').checked=false}};details.append(wrap);return details}
function authButton(provider,label,before=null){return action(label,async()=>{const popup=window.open('about:blank','_blank');if(!popup){$('error').textContent='浏览器拦截了登录窗口，请允许弹窗后重试。';return}popup.opener=null;try{if(before)await before();const data=await api('/api/v1/oauth/'+provider+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});popup.location.href=data.authorization_url;$('status').textContent='请在新窗口完成授权，成功后在新窗口继续设置。'}catch(error){popup.close();$('error').textContent=error.message}})}
function modelList(id,panel){const target=panel.querySelector('.model-list');if(!target)return;target.replaceChildren();const all=catalog.filter(x=>x.provider===id);if(!all.length){target.append(node('p','尚无模型。同步列表，或手动添加模型 ID。','help'));return}const filter=node('input');filter.type='search';filter.placeholder='搜索此服务商的模型';filter.setAttribute('aria-label','搜索 '+id+' 模型');target.append(filter);const rows=node('div'),paging=node('div',null,'provider-actions');target.append(rows,paging);let page=0;function draw(){rows.replaceChildren();paging.replaceChildren();const matching=all.filter(x=>x.model.toLowerCase().includes(filter.value.toLowerCase()));const pages=Math.max(1,Math.ceil(matching.length/10));page=Math.min(page,pages-1);for(const item of matching.slice(page*10,page*10+10)){const row=node('div',null,'model-row'),name=node('span',item.model,'model-name'),status=node('span','','model-status');row.append(name);const result=status;row.append(action('测试此模型',async()=>{result.textContent='正在测试此模型…';try{const data=await api('/api/v1/models/test-one',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,model:item.model})});result.textContent=data.health==='healthy'?'测试成功 · '+data.latency_ms+' 毫秒':data.health==='not_configured'?'请先完成授权或配置 API Key':'测试失败 · '+(data.reason||'请检查账号与模型权限')}catch(error){result.textContent=error.message}}));for(const [title,key,kind] of [['文字','PAODING_TEXT_ROUTE','text'],['图片','PAODING_IMAGE_ROUTE','image'],['视频','PAODING_VIDEO_ROUTE','video']]){const primary=(routes[kind]||[])[0];const selected=!!primary&&primary.provider===id&&primary.model===item.model;row.append(action(selected?'✓ '+title:'选为'+title,async()=>{try{const input=$(key);const selectedRoute={provider:id,model:item.model};const others=(routes[kind]||[]).filter(route=>route.provider!==id||route.model!==item.model);const updated=[selectedRoute,...others];input.value=updated.map(route=>route.provider+':'+route.model).join(',');await saveFields([key]);routes[kind]=updated;draw();$('status').textContent='已设为'+title+'模型。请确认模型具备相应模态能力。'}catch(error){result.textContent=error.message}}))}row.append(status);rows.append(row)}paging.append(action('上一页',()=>{page=Math.max(0,page-1);draw()}),node('span',(page+1)+' / '+pages+' 页 · '+matching.length+' 个模型','help'),action('下一页',()=>{page=Math.min(pages-1,page+1);draw()}))}filter.oninput=()=>{page=0;draw()};draw()}
async function updateCatalog(id){catalog=catalog.filter(x=>x.provider!==id).concat(await api('/api/v1/models?provider='+encodeURIComponent(id)));modelList(id,$('provider-'+id))}
function providerPanel(id,name,key,custom){const panel=node('section',null,'provider');panel.id='provider-'+id;panel.append(node('h3',name));const customPrefix='custom-'+id+'-';let keys=[];if(id==='chatgpt'){panel.append(node('p',chatgptConnected?'已通过 ChatGPT 授权。':'尚未连接 ChatGPT 账号。','help'));panel.append(authButton('chatgpt',chatgptConnected?'重新授权 ChatGPT':'Continue with ChatGPT'))}else if(id==='gemini_google'){panel.append(node('p',googleConnected?'已通过 Google Cloud 授权。':'尚未连接 Google Cloud 项目。请先填写 Google 授权配置。','help'));panel.append(authButton('gemini_google',googleConnected?'重新授权 Google':'使用 Google 授权',()=>saveFields(['PAODING_GOOGLE_OAUTH_CLIENT_ID','PAODING_GOOGLE_OAUTH_CLIENT_SECRET','PAODING_GOOGLE_PROJECT_ID'])))}else if(custom){for(const [suffix,label,type,val] of [['url','Base URL','url',custom.base_url],['key','API Key','password','']]){const f={key:customPrefix+suffix,label,group:'模型',secret:type==='password',value:val,configured:suffix==='key'?custom.configured:true};panel.append(fieldRow(f))}const l=node('label','支持 video_url 视频输入'),check=node('input');check.id=customPrefix+'video';check.type='checkbox';check.checked=!!custom.video_url_support;check.style.width='auto';l.prepend(check);panel.append(l);if(custom.environment_override)panel.append(node('p','此服务商的密钥由系统环境变量提供，需移除环境变量后才能在这里更换。','help'));if(id==='openrouter')panel.append(authButton('openrouter','使用 OpenRouter 网页授权'))}else{const base='PAODING_'+id.toUpperCase()+'_BASE_URL';keys=[base,key];for(const k of keys){const f=fields.find(x=>x.key===k);if(f)panel.append(fieldRow(f))}}
const actions=node('div',null,'provider-actions'),status=node('div','','result');status.id='result-'+id;const save=async()=>{if(id==='chatgpt'||id==='gemini_google')return;if(custom){const payload={id,name,base_url:$(customPrefix+'url').value.trim(),api_key:$(customPrefix+'key').value,video_url_support:$(customPrefix+'video').checked,video_audio:!!custom.video_audio};const saved=await api('/api/v1/models/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$(customPrefix+'key').value='';$('state-'+customPrefix+'key').textContent=saved.configured?'已配置':'未配置';custom.base_url=saved.base_url;custom.configured=saved.configured}else await saveFields(keys)};if(id!=='chatgpt'&&id!=='gemini_google')actions.append(action('保存',async()=>{try{await save();status.textContent='已保存。'}catch(error){status.textContent=error.message}}));actions.append(action('测试服务连接',async()=>{status.textContent='正在测试…';try{await save();const data=await api('/api/v1/models/probe?provider='+encodeURIComponent(id),{method:'POST'});status.textContent=data.health==='healthy'?'服务连接成功 · '+data.latency_ms+' 毫秒':data.health==='not_configured'?'请先完成授权或填写 API Key':'连接失败 · '+(data.reason||'请检查配置')}catch(error){status.textContent=error.message}}),action('同步最新模型',async()=>{status.textContent='正在同步…';try{await save();const response=await api('/api/v1/models/sync?provider='+encodeURIComponent(id),{method:'POST'}),item=response[0];if(item.status!=='synced')throw Error(item.status==='not_configured'?'请先授权或填写 API Key':'同步失败，可手动添加模型 ID。');await updateCatalog(id);status.textContent='已同步 '+item.count+' 个模型；请以服务商信息确认最新版本和模态。'}catch(error){status.textContent=error.message}}));panel.append(actions,status);const add=node('div',null,'model-add'),model=node('input');model.placeholder='手动输入模型 ID，例如 openai/gpt-4o';model.setAttribute('aria-label',name+' 模型 ID');add.append(model,action('添加模型',async()=>{try{await api('/api/v1/models/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id,model:model.value.trim()})});model.value='';await updateCatalog(id);status.textContent='模型已添加。'}catch(error){status.textContent=error.message}}));panel.append(add,node('div',null,'model-list'));return panel}
function render(){const groups=$('groups'),nav=$('nav');groups.replaceChildren();nav.replaceChildren();for(const group of groupNames){const items=fields.filter(f=>f.group===group);if(!items.length)continue;const d=node('details');d.id='group-'+group;d.open=group==='模型';d.append(node('summary',group));if(hints[group])d.append(node('p',hints[group],'group-help'));if(group==='模型'){const login=node('div',null,'custom-form');login.append(node('strong','网页授权'),node('p','使用 OpenRouter 账号可访问其提供的 GPT、Qwen、GLM 等模型，使用的是 OpenRouter 账户的额度；不代表授权了这些厂商的原生账号。','help'),authButton('chatgpt','Continue with ChatGPT'),document.createTextNode(' '),authButton('openrouter','使用 OpenRouter 网页授权'),document.createTextNode(' '),authButton('gemini_google','使用 Google 授权 Gemini',()=>saveFields(['PAODING_GOOGLE_OAUTH_CLIENT_ID','PAODING_GOOGLE_OAUTH_CLIENT_SECRET','PAODING_GOOGLE_PROJECT_ID'])),node('p','Gemini 的 Google 授权需先在“Google 授权”中填写云项目和 OAuth 客户端。','help'),node('p','其他厂商的网页登录能力取决于其官方 API 授权；可按下方配置 API Key。','help'));d.append(login,buildCustomForm());d.append(providerPanel('chatgpt','ChatGPT 登录',null,null),providerPanel('gemini_google','Gemini · Google 授权',null,null));for(const [id,name,key] of builtin)d.append(providerPanel(id,name,key,null));const extra=node('div');extra.id='custom-providers';for(const c of customs)extra.append(providerPanel(c.id,c.name,null,c));d.append(extra)}else for(const f of items)d.append(fieldRow(f));groups.append(d);const a=node('a',group);a.href='#'+d.id;a.onclick=()=>{d.open=true};nav.append(a)}for(const [id] of [['chatgpt'],['gemini_google'],...builtin,...customs.map(x=>[x.id])]){const p=$('provider-'+id);if(p)modelList(id,p)}}
async function saveFields(keys){const values={};for(const key of keys){const f=fields.find(x=>x.key===key),input=$(key);if(!f||!input)continue;if(f.secret?input.value!=='' : input.value!==input.dataset.initial)values[f.key]=input.value.trim()}if(!Object.keys(values).length)return;await api('/api/v1/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});for(const key of Object.keys(values)){const f=fields.find(x=>x.key===key),input=$(key),state=$('state-'+key);f.configured=!!values[key];state.textContent=f.configured?'已配置':'未配置';state.className='state'+(f.configured?' yes':'');if(f.secret){input.value='';input.placeholder='已配置，留空保持不变'}input.dataset.initial=input.value}$('status').textContent='已保存，新任务会使用更新后的配置。'}
$('connect').onclick=()=>{auth=$('token').value;localStorage.setItem('paoding-token',auth);load()};
$('form').onsubmit=async event=>{event.preventDefault();$('save').disabled=true;$('error').textContent='';try{await saveFields(fields.map(f=>f.key))}catch(error){$('status').textContent='';$('error').textContent=error.message}finally{$('save').disabled=false}};
load();
</script>
</body></html>
