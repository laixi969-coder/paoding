services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paoding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paoding}
      POSTGRES_DB: paoding
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paoding -d paoding"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
